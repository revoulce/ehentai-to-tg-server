[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ehentai-to-tg"
version = "0.2.0"
description = "Persistent application core for a private gallery publishing service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
ehtg = "ehtg.cli:main"

[project.optional-dependencies]
source = [
    "gallery-dl @ https://codeberg.org/mikf/gallery-dl/archive/61971e01d394d35c81a86d4d0d03717c78ae53d5.tar.gz#sha256=f48afb4c1ce7235e5bc83c585093da5b2557edf3776b0179b72260d8c961152d",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ehtg"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "ehtg/notices/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.uv]
required-version = ">=0.13,<0.14"
build-constraint-dependencies = ["setuptools==75.8.0"]
