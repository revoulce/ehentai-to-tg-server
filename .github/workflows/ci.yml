name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --extra source
      - run: uv run --locked --extra source ruff check src tests
      - run: uv run --locked --extra source ruff format --check src tests
      - run: uv run --locked --extra source mypy src
      - run: uv run --locked --extra source mypy --platform linux src
      - run: uv run --locked --extra source pytest
      - run: uv build --no-sources
